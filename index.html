<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pratik Koirala</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #ffffff;
      color: #0f172a;
      max-width: 600px;
      margin: 80px auto;
      padding: 0 20px;
      line-height: 1.6;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 4px;
      color: #0f172a;
    }
    p {
      color: #475569;
      font-size: 1.1rem;
      margin: 4px 0;
    }
    .links {
      margin-top: 24px;
    }
    a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 500;
      margin-right: 18px;
    }
    a:hover {
      text-decoration: underline;
    }
    footer {
      margin-top: 60px;
      padding-top: 20px;
      border-top: 1px solid #e2e8f0;
      font-size: 0.85rem;
      color: #64748b;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .commit-stat {
      color: #0f172a;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <h1>Pratik Koirala</h1>
  <p>🌐 Full-stack web applications</p>
  <p>🏛️ Civic-tech & transparency platforms</p>

  <div class="links">
    <a href="https://github.com/pratikkoiralazz" target="_blank">GitHub</a>
    <a href="https://www.linkedin.com/in/pratikkoiralazz/" target="_blank">LinkedIn</a>
  </div>

  <footer>
    <div id="live-time">Loading local time...</div>
    <div>Today's GitHub commits: <span id="commit-count" class="commit-stat">0</span></div>
  </footer>

  <script>
    // Live Clock Function
    function updateClock() {
      const now = new Date();
      const options = { 
        weekday: 'short', 
        year: 'numeric', 
        month: 'short', 
        day: 'numeric', 
        hour: '2-digit', 
        minute: '2-digit', 
        second: '2-digit',
        hour12: true 
      };
      document.getElementById('live-time').textContent = now.toLocaleString('en-US', options);
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Fetch Today's Live Commits via GitHub API
    async function fetchTodayCommits() {
      const username = 'pratikkoiralazz';
      const countElement = document.getElementById('commit-count');

      try {
        const response = await fetch(`https://api.github.com/users/${username}/events/public`);
        if (!response.ok) throw new Error('API request failed');

        const events = await response.json();
        
        // Get local date string formatted as YYYY-MM-DD
        const now = new Date();
        const localToday = now.getFullYear() + '-' + 
          String(now.getMonth() + 1).padStart(2, '0') + '-' + 
          String(now.getDate()).padStart(2, '0');

        let commitCount = 0;

        events.forEach(event => {
          if (event.type === 'PushEvent') {
            const eventDateObj = new Date(event.created_at);
            const eventLocalDate = eventDateObj.getFullYear() + '-' + 
              String(eventDateObj.getMonth() + 1).padStart(2, '0') + '-' + 
              String(eventDateObj.getDate()).padStart(2, '0');

            if (eventLocalDate === localToday) {
              const commitsInPush = (event.payload && event.payload.commits) 
                ? event.payload.commits.length 
                : 1;
                
              commitCount += commitsInPush;
            }
          }
        });

        countElement.textContent = commitCount;
      } catch (error) {
        console.error('Error fetching commits:', error);
        countElement.textContent = '0';
      }
    }

    fetchTodayCommits();
  </script>

</body>
</html>
